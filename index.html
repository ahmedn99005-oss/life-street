<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121922">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شارع الحياة">
<meta name="description" content="لعبة محاكاة حياة 3D: اشتغل، افتح محلات، استورد من الصين، وابني العاصمة الجديدة.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#121922}</style>
</head>
<body>
<title>شارع الحياة</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-screen canvas street; HUD floats on top; shops open as counter-style bottom sheets */
:root {
  --ink: #121922;
  --panel: #1c2632;
  --panel-2: #26333f;
  --line: #3a4a5a;
  --text: #f1ece0;
  --muted: #a6b1bd;
  --taxi: #f4b81c;
  --taxi-ink: #2a1f00;
  --good: #5cc27a;
  --warn: #f08a3c;
  --bad: #e5534b;
  --water: #4fa8e0;
  --sleep: #8f86e8;
  --f-display: "Lalezar", "Readex Pro", system-ui, sans-serif;
  --f-body: "Readex Pro", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-user-select: none; user-select: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input { -webkit-user-select: text; user-select: text; }
#game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--taxi); outline-offset: 2px; }

/* HUD */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.card { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; backdrop-filter: blur(6px); }
.clock { display: flex; flex-direction: column; justify-content: center; min-width: 96px; }
.clock small, .money small { color: var(--muted); font-size: 11px; letter-spacing: .02em; }
.clock b { font-family: var(--f-display); font-size: 22px; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.money { display: flex; flex-direction: column; justify-content: center; background: var(--taxi); color: var(--taxi-ink); border-color: transparent; }
.money small { color: color-mix(in srgb, var(--taxi-ink) 70%, transparent); }
.money b { font-family: var(--f-display); font-size: 22px; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.money.flash { animation: flash .6s; }
@keyframes flash { 30% { transform: scale(1.08); } }
.needs { display: grid; grid-template-columns: auto 90px; gap: 3px 8px; align-items: center; font-size: 11px; }
.needs span { color: var(--muted); }
.bar { height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 4px; transition: width .3s; }
.bar.low i { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.hud-btns { display: flex; gap: 6px; margin-inline-start: auto; align-items: center; }
.hud-btns button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.hud-btns button:hover { background: var(--panel-2); }

/* Prompt + mobile action */
.prompt {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-size: 14px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
kbd { font-family: var(--f-body); background: var(--taxi); color: var(--taxi-ink); border-radius: 5px; padding: 0 7px; font-weight: 700; }
.actbtns {
  position: fixed; z-index: 6; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
body.joy-right .actbtns { right: auto; left: max(20px, calc(env(safe-area-inset-left, 0px) + 20px)); }
.act.alt { background: var(--panel); color: var(--text); border: 2px solid var(--taxi); }
.act {
  width: 74px; height: 74px; border-radius: 50%; border: 0; background: var(--taxi); color: var(--taxi-ink); font-family: var(--f-display); font-size: 20px; box-shadow: 0 6px 18px rgba(0,0,0,.4);
}
body.touch .prompt .kb { display: none; }
body.touch .prompt { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }

/* Toasts */
.toasts { position: fixed; top: calc(var(--hud-h, 110px) + 8px); left: 50%; transform: translateX(-50%); z-index: 8; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 14px; animation: tin .25s ease-out; text-align: center; }
.toast.good { border-color: var(--good); }
.toast.bad { border-color: var(--bad); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

/* Panels */
.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(6,10,16,.55); display: flex; align-items: center; justify-content: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet { width: min(580px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.sheet header { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.sheet header .t { flex: 1; min-width: 0; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.2; text-wrap: balance; }
.sheet header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.x { background: transparent; border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; flex: none; }
.pbody { padding: 14px 18px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.note { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.row .ico { font-size: 26px; text-align: center; }
.row .info { min-width: 0; }
.row .info b { display: block; font-size: 15px; }
.row .info small { color: var(--muted); font-size: 12px; }
.row .btns { display: flex; gap: 6px; grid-column: 1 / -1; justify-content: flex-end; flex-wrap: wrap; }
.price { font-family: var(--f-display); font-size: 20px; color: var(--taxi); font-variant-numeric: tabular-nums; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--taxi); color: var(--taxi-ink); border-color: transparent; font-weight: 700; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.big { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); text-align: start; }
.big b { font-size: 16px; }
.big small { color: var(--muted); font-size: 13px; }
.big:hover { border-color: var(--taxi); }

/* Work */
.shiftbar { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.shiftbar b { color: var(--text); font-variant-numeric: tabular-nums; }
.customer { display: flex; gap: 12px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: #1a1a1a; }
.bubble { min-width: 0; }
.bubble b { font-size: 14px; color: var(--muted); font-weight: 600; }
.bubble p { margin: 2px 0 0; font-size: 16px; line-height: 1.6; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.shelf button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
.shelf button:hover { border-color: var(--taxi); }
.shelf .ico { font-size: 24px; }
.shelf small { color: var(--taxi); font-variant-numeric: tabular-nums; }
.counter { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.counter h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.citem { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.citem button { background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 26px; height: 26px; line-height: 1; }
.ctotal { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.msg { border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.6; background: var(--panel-2); }
.msg.good { border-inline-start: 4px solid var(--good); }
.msg.bad { border-inline-start: 4px solid var(--bad); }
.changeopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.changeopts button { padding: 14px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.changeopts button:hover { border-color: var(--taxi); color: var(--taxi); }

/* Wallet */
.balance { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: var(--taxi); color: var(--taxi-ink); border-radius: 12px; padding: 14px 16px; }
.balance b { font-family: var(--f-display); font-size: 34px; font-weight: 400; font-variant-numeric: tabular-nums; }
.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
.ledger td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.ledger td:last-child { text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
.ledger .when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.plus { color: var(--good); } .minus { color: var(--bad); }

.fade { position: fixed; inset: 0; z-index: 20; background: #05070c; display: grid; place-items: center; color: var(--text); font-family: var(--f-display); font-size: 40px; opacity: 0; pointer-events: none; transition: opacity .5s; }
.fade.on { opacity: 1; pointer-events: auto; }

@media (max-width: 560px) {
  .needs { grid-template-columns: auto 64px; }
  .hud-btns { margin-inline-start: 0; }
  .overlay { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 16px 16px 0 0; max-height: 88%; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet h2 { font-size: 24px; }
}

/* Goal + specs */
.goal { display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border-radius: 12px; padding: 12px 14px; }
.goal-top { display: flex; justify-content: space-between; font-size: 14px; }
.goal-top b { color: var(--taxi); font-variant-numeric: tabular-nums; }
.goal-bar { height: 12px; border-radius: 6px; background: var(--ink); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: var(--taxi); border-radius: 6px; min-width: 4px; }
.goal small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.specs div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.specs small { color: var(--muted); font-size: 11px; }
.specs b { font-size: 14px; }

/* Settings, bank, seller, bag */
.setting { display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border-radius: 12px; padding: 12px 14px; }
.setting b { font-size: 15px; }
.setting small { color: var(--muted); font-size: 12px; line-height: 1.5; }
.seg { display: flex; gap: 4px; background: var(--ink); border-radius: 10px; padding: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 8px 6px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--taxi); color: var(--taxi-ink); font-weight: 700; }
.range { display: flex; align-items: center; gap: 10px; }
.range input { flex: 1; accent-color: var(--taxi); }
.range output { min-width: 3em; text-align: center; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--panel-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat small { color: var(--muted); font-size: 12px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.stat.acc { background: #2f5d50; }
.amount { display: flex; flex-direction: column; gap: 6px; }
.amount label { font-size: 13px; color: var(--muted); }
.amount input { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); color: var(--text); font-variant-numeric: tabular-nums; width: 100%; }
.amount input:focus { outline: 2px solid var(--taxi); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.sec { margin: 4px 0 0; font-size: 14px; display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; }
.sec span { font-variant-numeric: tabular-nums; }
.owned { color: var(--good); font-size: 14px; font-weight: 700; padding: 7px 4px; }
@media (max-width: 560px), (max-height: 500px) {
  .hud { gap: 6px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
  .card { padding: 4px 8px; border-radius: 8px; }
  .clock { min-width: 0; }
  .clock b, .money b { font-size: 17px; }
  .clock small, .money small { font-size: 10px; }
  .needs { grid-template-columns: auto 52px; gap: 2px 6px; font-size: 10px; }
  .bar { height: 6px; }
  .hud-btns { gap: 4px; }
  .hud-btns button { padding: 6px 9px; font-size: 12px; border-radius: 8px; }
  .hud .mini { width: 120px; height: 36px; }
  .prompt { font-size: 13px; padding: 6px 14px; }
  .act { width: 62px; height: 62px; font-size: 17px; }
  .toast { font-size: 13px; padding: 6px 12px; }
}

.notice { flex-basis: 100%; font-size: 13px; line-height: 1.5; border-color: var(--taxi); }
.row.hire .btns { flex-direction: column; align-items: stretch; }
.hire-ctl { gap: 8px; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--ink); border-radius: 10px; padding: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 8px; border: 0; background: var(--panel-2); font-size: 18px; }
.stepper span { font-variant-numeric: tabular-nums; font-size: 14px; }
.stepper.wide { flex-wrap: wrap; justify-content: center; }
.stepper.wide button { width: auto; min-width: 36px; padding: 0 8px; font-size: 13px; }
.stepper.wide span { min-width: 64px; text-align: center; }
.chip.on { background: var(--taxi); color: var(--taxi-ink); border-color: transparent; font-weight: 700; }
.price .pd { font-family: var(--f-body); font-size: 11px; color: var(--muted); }

.desktop { position: relative; min-height: 300px; border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, #1f5f8f, #2f5d50); display: flex; flex-direction: column; }
.desk-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; color: #f1ece0; }
.desk-empty b { font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.desk-empty small { color: rgba(241,236,224,.75); font-size: 13px; }
.taskbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(0,0,0,.45); color: #f1ece0; font-size: 13px; font-variant-numeric: tabular-nums; }
.taskbar .start { background: var(--taxi); color: var(--taxi-ink); border-radius: 6px; padding: 2px 10px; font-weight: 700; }

.codebox { display: flex; gap: 8px; }
.codebox input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); color: var(--text); }
.codebox input:focus { outline: 2px solid var(--taxi); outline-offset: 1px; }
.icons { flex: 1; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; padding: 18px; }
.app-icon { position: relative; width: 104px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(0,0,0,.2); color: #f1ece0; font-size: 13px; }
.app-icon span { font-size: 34px; }
.app-icon:hover { background: rgba(0,0,0,.35); border-color: var(--taxi); }
.app-icon i { position: absolute; top: 6px; left: 6px; font-style: normal; background: var(--taxi); color: var(--taxi-ink); border-radius: 999px; min-width: 20px; padding: 0 5px; font-size: 12px; font-weight: 700; }
.window { display: flex; flex-direction: column; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 12px; }
.win-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.win-head b { font-size: 16px; }
.pin { width: 90px; font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); color: var(--text); font-variant-numeric: tabular-nums; }
.pin:focus, .offer-form input:focus, .offer-form select:focus { outline: 2px solid var(--taxi); outline-offset: 1px; }
.ptable td { vertical-align: middle; }
.ptable td:last-child { text-align: start; }
.offer-form { display: flex; flex-direction: column; gap: 6px; }
.offer-form label { font-size: 12px; color: var(--muted); }
.offer-form input, .offer-form select { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); color: var(--text); width: 100%; }
.offer-form .two > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row.offer.off { opacity: .55; }
.window .row { background: var(--panel); }

.inv { display: flex; flex-direction: column; gap: 8px; }
.inv-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; align-items: center; background: var(--panel); border-radius: 10px; padding: 10px 12px; }
.inv-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.inv-name small, .inv-cell small { color: var(--muted); font-size: 11px; }
.inv-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-variant-numeric: tabular-nums; }
.inv-cell b { font-size: 14px; }
.mini-bar { height: 6px; border-radius: 3px; background: var(--ink); overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--water); }
.mini-bar.shelf i { background: var(--good); }
@media (max-width: 560px) { .inv-row { grid-template-columns: 1fr 1fr; } .inv-name { grid-column: 1 / -1; } }

.tscroll { overflow-x: auto; }
.acct td { white-space: nowrap; font-variant-numeric: tabular-nums; }
.acct td:last-child { text-align: start; }
.acct .tot td { border-top: 2px solid var(--line); }
.dchart { display: flex; flex-direction: column; gap: 6px; }
.dbar { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.dl { color: var(--muted); }
.dv { font-variant-numeric: tabular-nums; white-space: nowrap; }
.dv small { color: var(--good); }
.dtrack { position: relative; height: 14px; background: var(--ink); border-radius: 4px; overflow: hidden; }
.dtrack i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.dtrack i.rev, .legend i.rev { background: var(--water); }
.dtrack i.prof, .legend i.prof { background: var(--good); }
[dir="rtl"] .dtrack i { inset: 0 0 0 auto; }
.legend { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

function buildBackdrop() {
  // عمارات بعيدة عشان المدينة تبان مليانة
  // كل خامة فيها 4×4 شبابيك، والإزاز فيه انعكاس السما
  const cells = fn => { for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) fn(i * 64, j * 64, j * 4 + i); };
  const winTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    cells((x, y) => {
      const gr = g.createLinearGradient(0, y + 16, 0, y + 46); gr.addColorStop(0, '#a9c2d6'); gr.addColorStop(1, '#46596b');
      g.fillStyle = gr; g.fillRect(x + 14, y + 16, 36, 30);
      g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(x + 14, y + 16, 36, 3);
      g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(x + 11, y + 46, 42, 4);
    });
  });
  // بالليل: شبابيك متفرقة منوّرة (3 أشكال مختلفة)
  const litTex = [0, 1, 2].map(v => { const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    cells((x, y, k) => { if (hash(v * 31 + k * 1.7) < 0.38) { g.fillStyle = ['#ffcf7a', '#ffe6a8', '#cfe2ff'][Math.floor(hash(v + k * 3.3) * 3)]; g.fillRect(x + 14, y + 16, 36, 30); } });
  }); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; });
  const tones = ['#8d7f6e', '#a08d77', '#7c8288', '#9a8a7a', '#6f6a64', '#b0a08a'];
  const row = (z0, depth, seed) => {
    for (let x = STREET.x0, i = 0; x < STREET.x1; i++) {
      const w = 8 + hash(seed + i) * 10, h = 12 + hash(seed + i * 3.1) * 22;
      if (z0 < 0 && x + w > 158 && x < 192) { x += w + 0.5; continue; }   // مكان أوضة مكتب المحل
      const t = winTex.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.round(w / 3) / 4, Math.round(h / 3) / 4);
      const mat = new THREE.MeshLambertMaterial({ color: tones[i % tones.length], map: t, emissive: 0xffffff, emissiveMap: litTex[i % 3], emissiveIntensity: 0 });
      nightMats.push({ m: mat, k: 0.85 });
      add(boxMesh(w, h, depth, mat), x + w / 2, h / 2, z0, false, false);
      x += w + 0.5;
    }
  };
  row(-18, 12, 1); row(76, 10, 7);
  // البيوت ورا الكشك (عشان مايبقاش فيه فراغ)
  add(boxMesh(11, 8, 6, M('#9a8a7a')), 95.5, 4, -9, true, false);
}

function facadeTexture(p, emissive) {
  const ppm = 48, W = Math.round(p.w * ppm), H = Math.round(p.h * ppm);
  return canvasTex(W, H, (g) => {
    const Y = m => H - m * ppm, X = m => m * ppm;
    const cx = p.w / 2;
    g.fillStyle = emissive ? '#000' : p.wall; g.fillRect(0, 0, W, H);
    if (!emissive) {
      for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * .05})`; g.fillRect(Math.random() * W, Math.random() * H, 4, 4); }
      g.fillStyle = p.trim; g.fillRect(0, 0, W, 0.4 * ppm);
      for (let fy = 4.2; fy < p.h - 0.5; fy += 3) g.fillRect(0, Y(fy) - 4, W, 8);
    }
    // شبابيك الأدوار اللي فوق
    let wi = 0;
    for (let fy = 4.2; fy + 2.6 < p.h; fy += 3) {
      for (let wx = 1.2; wx + 1.2 < p.w - 0.6; wx += 2.6) {
        const lit = hash(p.x * 13 + wi++) > 0.35;
        if (!emissive) { g.fillStyle = p.trim; g.fillRect(X(wx) - 5, Y(fy + 2.3) - 5, X(1.2) + 10, X(1.5) + 10); g.fillStyle = '#8fb3c9'; }
        else g.fillStyle = lit ? '#ffcf70' : '#000';
        g.fillRect(X(wx), Y(fy + 2.3), X(1.2), X(1.5));
        if (!emissive) { g.fillStyle = p.trim; g.fillRect(X(wx + 0.58), Y(fy + 2.3), 4, X(1.5)); }
      }
    }
    // اليافطة
    const sw = Math.min(p.w - 1, 10), sy0 = p.type === 'kiosk' ? 3.0 : 3.1, sh = 0.95;
    if (!emissive) { g.fillStyle = p.trim; g.fillRect(X(cx - sw / 2), Y(sy0 + sh), X(sw), X(sh)); }
    g.fillStyle = emissive ? '#c8b070' : p.sign;
    g.font = `${Math.round(0.68 * ppm)}px Lalezar, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
    g.fillText(placeName(p), X(cx), Y(sy0 + sh / 2) + 3);
    // الدور الأرضي
    if (p.type === 'home') {
      for (const wx of [1.5, p.w - 3.1]) {
        if (!emissive) { g.fillStyle = p.trim; g.fillRect(X(wx) - 6, Y(2.4) - 6, X(1.6) + 12, X(1.3) + 12); g.fillStyle = '#8fb3c9'; } else g.fillStyle = '#e0a850';
        g.fillRect(X(wx), Y(2.4), X(1.6), X(1.3));
      }
    } else {
      const gw = cx - 1.4 - 0.6;
      for (const gx of [0.6, cx + 1.4]) {
        g.fillStyle = emissive ? (p.type === 'soon' ? '#302818' : '#ffe0a0') : '#9cc0d4';
        g.fillRect(X(gx), Y(2.5), X(gw), X(1.9));
        if (!emissive) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(X(gx + .2), Y(2.4), X(.3), X(1.7)); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(X(gx), Y(1.0), X(gw), X(0.4)); }
      }
    }
    // الباب
    if (!emissive) {
      g.fillStyle = p.trim; g.fillRect(X(cx - 0.85), Y(2.55), X(1.7), X(2.55));
      g.fillStyle = p.type === 'soon' ? '#555' : '#4a2f1d'; g.fillRect(X(cx - 0.7), Y(2.4), X(1.4), X(2.4));
      g.fillStyle = '#e8c35a'; g.beginPath(); g.arc(X(cx + 0.45), Y(1.15), 5, 0, 7); g.fill();
    } else if (p.type !== 'soon') { g.fillStyle = '#7a5a30'; g.fillRect(X(cx - 0.5), Y(2.2), X(1.0), X(0.6)); }
    if (p.type === 'forsale' && !isOwned(p)) {
      // الإزاز متغطي ورق ويافطة للبيع
      const gw = cx - 1.4 - 0.6;
      for (const gx of [0.6, cx + 1.4]) {
        g.fillStyle = emissive ? '#000' : '#d9d2c0'; g.fillRect(X(gx), Y(2.5), X(gw), X(1.9));
        if (!emissive) { g.fillStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 18; i++) g.fillRect(X(gx) + Math.random() * X(gw - 1), Y(2.4) + Math.random() * X(1.6), X(1), 3); }
      }
      g.fillStyle = emissive ? '#601010' : '#c62828'; g.fillRect(X(1.2), Y(2.35), X(cx - 2.6), X(1.4));
      g.fillStyle = emissive ? '#000' : '#fff';
      g.font = `${Math.round(0.6 * ppm)}px Lalezar, sans-serif`; g.fillText('للبيع', X(1.2 + (cx - 2.6) / 2), Y(1.95));
      g.font = `${Math.round(0.42 * ppm)}px Lalezar, sans-serif`; g.fillText(`${p.price.toLocaleString('en-US')} ج`, X(1.2 + (cx - 2.6) / 2), Y(1.3));
    }
    if (p.type === 'soon' && !emissive) {
      g.fillStyle = '#f4b81c'; g.fillRect(X(cx - 1.3), Y(1.7), X(2.6), X(0.55));
      g.fillStyle = '#2a1f00'; g.font = `${Math.round(0.42 * ppm)}px Lalezar, sans-serif`; g.fillText('قريبًا', X(cx), Y(1.42) + 2);
    }
  });
}

function buildPlace(p) {
  if (p.id === 'bigshop') return buildBigShop(p);
  if (p.id === 'market') return buildMarket(p);
  const depth = p.type === 'kiosk' ? 5 : 11;
  const front = new THREE.MeshLambertMaterial({ map: facadeTexture(p, false), emissive: 0xffffff, emissiveMap: facadeTexture(p, true), emissiveIntensity: 0 });
  nightMats.push({ m: front, k: 1 });
  p.front = front;
  const wall = M(p.wall);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, depth), [wall, wall, M(p.trim), wall, front, wall]);
  add(mesh, p.x + p.w / 2, p.h / 2, -depth / 2);
  add(boxMesh(p.w + 0.4, 0.4, 0.5, M(p.trim)), p.x + p.w / 2, p.h - 0.2, 0.15); // كورنيش
  add(boxMesh(1.9, 0.12, 0.7, M('#8f8a80')), doorX(p), 0.22, 0.35, false);       // سلمة الباب
  if (p.awning) {
    const t = canvasTex(64, 8, (g, w, h) => { g.fillStyle = p.awning[0]; g.fillRect(0, 0, w / 2, h); g.fillStyle = p.awning[1]; g.fillRect(w / 2, 0, w / 2, h); }, [Math.round(p.w / 1.2), 1]);
    const aw = boxMesh(p.w - 0.6, 0.06, 1.5, new THREE.MeshLambertMaterial({ map: t }));
    aw.rotation.x = 0.32; add(aw, p.x + p.w / 2, 2.85, 0.7);
  }
  addGlow(doorX(p), 1.8, p.w * 0.35, p.type === 'soon' ? 0.3 : 0.7, 0xffd590);
}

function refreshFacade(p) {
  if (!p.front) return;
  if (p.id === 'bigshop') return refreshBigShop(p);
  if (p.id === 'market') return refreshMarket(p);
  p.front.map.dispose(); p.front.emissiveMap.dispose();
  p.front.map = facadeTexture(p, false); p.front.emissiveMap = facadeTexture(p, true); p.front.needsUpdate = true;
}

function movePlayer(dt) {

function toast(text, kind = '', ms = 2800) {

// ---------- الشغل: بياع في مكتبة النور ----------
let shift = null;
const OPEN_H = 8, CLOSE_H = 20;
function workPanel(place) {
  const h = hourNow();
  if (h < OPEN_H || h >= CLOSE_H) {
    openPanel(place.name, 'مواعيد الشغل من 8 الصبح لـ 8 بالليل', body => {

    });

  }

  openPanel(place.name, 'إنت البياع. هات للزبون اللي طلبه بالظبط وبعدين رجّعله الباقي صح.', renderShift, { onClose: endShift });
}
function newCustomer() {
  const pool = shuffle(Object.keys(STOCK).filter(k => k !== 'bag' || Math.random() < .3));
  const count = pick([1, 1, 2, 2, 2, 3]);
  const want = pool.slice(0, count).map(id => ({ id, q: STOCK[id].price >= 25 ? 1 : randi(1, 3) }));
  const total = want.reduce((s, w) => s + STOCK[w.id].price * w.q, 0);
  shift.cust = { ...pick(CUSTOMERS), want, total, counter: {}, stage: 'pick', mistakes: 0, msg: null };
}
function wantText(c) {
  return c.want.map(w => `${w.q} ${STOCK[w.id].name}`).join(' و ');
}
function renderShift(body) {
  const c = shift.cust;
  const closed = hourNow() >= CLOSE_H;
  const tooTired = state.needs.energy < 6;
  let main = '';
  if (closed || tooTired) {
    main = `<div class="msg">${closed ? 'الساعة بقت 8، المكتبة هتقفل. شغل النهارده خلص.' : 'إنت مهدود خالص ومش قادر تكمّل. روّح نام.'}</div>
      <div class="actions"><button class="btn pri" type="button" data-act="end">اقبض ${fmt(shift.earned)} وامشي</button></div>`;
  } else if (c.stage === 'pick') {
    const items = Object.entries(c.counter).filter(([, q]) => q > 0);
    const ctotal = items.reduce((s, [id, q]) => s + STOCK[id].price * q, 0);
    main = `
      ${c.msg ? `<div class="msg ${c.msg.k}">${c.msg.t}</div>` : ''}
      <div class="shelf">${Object.entries(STOCK).map(([id, s]) => `
        <button type="button" data-act="add:${id}"><span class="ico">${s.icon}</span>${s.name}<small>${s.price} ج</small></button>`).join('')}</div>
      <div class="counter"><h3>على الكاونتر</h3>
        ${items.length ? items.map(([id, q]) => `<div class="citem"><span>${STOCK[id].icon} ${q} × ${STOCK[id].name}</span><span><button type="button" data-act="rem:${id}" aria-label="شيل واحد">−</button></span></div>`).join('') : '<span class="note">دوس على الحاجة من الرف عشان تحطها هنا</span>'}
        <div class="ctotal"><span>الإجمالي</span><span>${fmt(ctotal)}</span></div>
      </div>
      <div class="actions"><button class="btn pri" type="button" data-act="give" ${items.length ? '' : 'disabled'}>سلّم الطلب</button><button class="btn" type="button" data-act="clear">فضّي الكاونتر</button><button class="btn" type="button" data-act="end" style="margin-inline-start:auto">خلّص الوردية</button></div>`;
  } else if (c.stage === 'change') {
    main = `
      ${c.msg ? `<div class="msg ${c.msg.k}">${c.msg.t}</div>` : ''}
      <div class="msg">الحساب <b>${fmt(c.total)}</b> · الزبون إداك <b>${fmt(c.bill)}</b>. الباقي كام؟</div>
      <div class="changeopts">${c.options.map(v => `<button type="button" data-act="chg:${v}">${v}</button>`).join('')}</div>`;
  } else {
    main = `<div class="msg good">${c.msg.t}</div>
      <div class="actions"><button class="btn pri" type="button" data-act="next">الزبون اللي بعده</button><button class="btn" type="button" data-act="end">اقبض ${fmt(shift.earned)} وامشي</button></div>`;
  }
  body.innerHTML = `
    <div class="shiftbar"><span>الساعة <b>${clockText()}</b></span><span>مكسب الوردية <b>${fmt(shift.earned)}</b></span><span>زباين <b>${shift.served}</b></span><span>طاقتك <b>${Math.round(state.needs.energy)}%</b></span></div>
    ${closed || tooTired ? '' : `<div class="customer"><div class="avatar" style="background:${c.c}">${c.n.replace(/^(أم|أستاذ|مدام|الحاجة|عم) /, '')[0]}</div>
      <div class="bubble"><b>${c.n}</b><p>«${c.f ? 'عايزة' : 'عايز'} ${wantText(c)} لو سمحت»</p></div></div>`}
    ${main}`;
  bind(body, {
    add: id => { c.counter[id] = (c.counter[id] || 0) + 1; rerender(); },
    rem: id => { c.counter[id]--; rerender(); },
    clear: () => { c.counter = {}; rerender(); },
    give: () => checkOrder(c),
    chg: v => checkChange(c, +v),
    next: () => { newCustomer(); rerender(); },
    end: () => closePanel(),
  });
}
function checkOrder(c) {
  const ok = c.want.every(w => (c.counter[w.id] || 0) === w.q) &&
    Object.entries(c.counter).every(([id, q]) => q === 0 || c.want.some(w => w.id === id));
  if (!ok) {
    c.mistakes++;
    c.msg = { k: 'bad', t: `«لأ، ده مش اللي طلبته! أنا ${c.f ? 'عايزة' : 'عايز'} ${wantText(c)}»` };
    rerender(); return;
  }
  const bills = [5, 10, 20, 50, 100, 200];
  let bill = bills.find(b => b >= c.total) || Math.ceil(c.total / 100) * 100;
  if (Math.random() < .35) bill = bills.find(b => b > bill) || bill + 100;
  c.bill = bill;
  const right = bill - c.total;
  const opts = new Set([right]);
  while (opts.size < 3) { const d = pick([-10, -5, -2, -1, 1, 2, 5, 10]); if (right + d >= 0) opts.add(right + d); }
  c.options = shuffle([...opts]);
  c.stage = 'change'; c.msg = null;
  rerender();
}
function checkChange(c, v) {
  const right = c.bill - c.total;
  if (v !== right) {
    c.mistakes++;
    c.msg = v < right ? { k: 'bad', t: '«الباقي ناقص يا أستاذ! عِد تاني»' } : { k: 'bad', t: '«إنت إديتني زيادة… خد رجّع، عِد تاني»' };
    rerender(); return;
  }
  const perfect = c.mistakes === 0;
  const pay = 8 + Math.round(c.total * 0.1) + (perfect ? 5 : 0);
  shift.earned += pay; shift.served++;
  state.stats.customers++;
  advanceTime(12, 'work');
  c.stage = 'done';
  c.msg = { t: `«تسلم إيدك!» · كسبت ${pay} ج${perfect ? ' (منهم 5 ج بقشيش عشان مغلطتش)' : ''}` };
  rerender();
}
function endShift() {
  if (!shift) return;
  const s = shift; shift = null;
  if (s.earned > 0) {
    Economy.add(s.earned, `وردية في مكتبة النور · ${s.served} زبون`);
    state.stats.shifts++; state.stats.earned += s.earned;
    toast(`قبضت ${fmt(s.earned)} من الوردية`, 'good');
  }
}

const QUALITY = { high: { pr: 2, shadow: 2048 }, medium: { pr: 1.5, shadow: 1024 }, low: { pr: 1, shadow: 0 } };

// النقلة: 3 دقايق يطلع الشارع، 17 لحد المخزن، 2 يركن، ينزّل، وبعدين يرجع بنفس الطريقة (كله بوقت اللعبة)
function truckPose(t) {
  const P = TRUCK.park, Wp = TRUCK.wh, k = (a, b) => clamp((t - a) / (b - a), 0, 1);
  if (t < 3) return { x: P.x, z: lerp(P.z, 7, k(0, 3)), ry: 0 };
  if (t < 20) return { x: lerp(P.x, Wp.x, k(3, 20)), z: 7, ry: 0 };
  if (t < 22) return { x: Wp.x, z: lerp(7, Wp.z, k(20, 22)), ry: 0 };
  if (t < 25) return { x: Wp.x, z: lerp(Wp.z, 11, k(22, 25)), ry: Math.PI };
  if (t < 42) return { x: lerp(Wp.x, P.x, k(25, 42)), z: 11, ry: Math.PI };
  return { x: P.x, z: lerp(11, P.z, k(42, 45)), ry: Math.PI };
}
function truckUnload() {

    const room = WH_CAP * PRODUCTS[c.id].perCarton - (state.warehouse[c.id] || 0), a = Math.min(room, c.pcs);
    if (a > 0) { state.warehouse[c.id] = (state.warehouse[c.id] || 0) + a; c.pcs -= a; moved++; }
    return c.pcs > 0;

  toast(`🚚 عم حمدي نزّل ${moved} كرتونة في المخزن${state.truck.load.length ? ` · ${state.truck.load.length} كرتونة مالهاش مكان ورجعت معاه` : ''}`, 'good', 5000);

function rep() { if (!state.rep) state.rep = { score: 3, recent: [], reviews: [] }; return state.rep; }

function saleRating(c, b) {
  const ratio = b.total / (b.qty * DEFAULT_PRICES[b.pid]);
  let r = 4;
  r += ratio <= 0.9 ? 0.6 : ratio <= 1.05 ? 0.2 : ratio <= 1.3 ? -0.4 : -1;
  const w = c.queueT || 0;
  r += w < 8 ? 0.4 : w < 25 ? 0 : w < 60 ? -0.6 : -1.2;
  if (c.offer) r += 0.3;
  if (c.helped) r += 0.2;   // حد ساعده وهو بيختار
  r -= 0.3 * (c.mistakes || 0);
  return clamp(r, 1, 5);
}

// ---------- المحل وانت نايم: حساب المبيعات للوقت اللي بيتقفز ----------
let simAcc = 0, away = null;
function simulateShop(mins) {
  updateWholesale(); hrTick(); mgrTick(); updateOnlineOrders();
  const sh = curShift(), on = r => state.staff.filter(e => e.role === r && shiftOf(e) === sh).length;
  const cash = on('cashier'), sales = on('sales'), stock = on('stock');
  // عمال الرص بيملوا الرفوف من المخزن
  if (stock) for (const sl of state.slots) if (sl.pid && sl.pcs < slotCap(sl) && (state.warehouse[sl.pid] || 0) > 0) {
    const a = Math.min(slotCap(sl) - sl.pcs, state.warehouse[sl.pid]); sl.pcs += a; state.warehouse[sl.pid] -= a;
  }
  // نفس معدل الزباين اللي في المحل وانت صاحي (بالثانية الحقيقية)، ومحدود بسعة المحل وسرعة الكاشير
  const sec = mins / settings.timeSpeed;   // الثواني الحقيقية اللي كانت هتعدّي
  let rate = (1 + 0.5 * sales) * repMult() * drawMult() * season().demand * shiftDemand() * cityMult() * kidBoost('shop') / 26;
  rate = Math.min(rate, shopCap() / 40, cash ? cash / checkoutSec() : 0);
  simAcc += rate * sec * 0.85;   // 0.85: الزباين الحقيقيين بياخدوا وقت يمشوا ويختاروا
  let n = Math.floor(simAcc); simAcc -= n;
  // زباين الإعلان اللي كان المفروض ييجوا في الوقت ده
  const ad = activeAd(); let adN = 0;
  if (ad) {
    if (absNow() > ad.end + AD_GRACE) finishAd(ad);
    else { const prog = clamp((absNow() + mins - ad.start) / (ad.end - ad.start), 0, 1); adN = Math.max(0, Math.floor(ad.total * prog) - ad.spawned); ad.spawned += adN; }
  }
  if (!away) away = { n: 0, rev: 0, lost: 0 };
  for (let i = 0; i < n + adN; i++) simCustomer(i >= n ? ad : null, cash > 0, sales);
  let subN = 0;
  for (const sb of activeSubs()) {
    if (absNow() > sb.end + AD_GRACE) { finishSub(sb); continue; }
    const k = Math.max(0, Math.floor(sb.total * subProg(sb, absNow() + mins)) - sb.spawned); sb.spawned += k; subN += k;
    for (let i = 0; i < k; i++) simCustomer(sb, cash > 0, sales);
  }
  if (n + adN + subN) refreshStockVisuals();
}
function simCustomer(ad, hasCash, sales) {
  const s = salesToday(), c = { who: pick(CUSTOMERS), queueT: 3 };
  const lost = why => { s.lost++; away.lost++; if (ad) ad.left++; repRecord(c, why === 'wait' ? 1 : why === 'price' ? 2 : 1.5, why); };
  if (!hasCash) return lost('wait');
  let b;
  if (hasUp('copier') && Math.random() < 0.2) {
    const price = state.prices.print ?? DEFAULT_PRICES.print, ratio = price / DEFAULT_PRICES.print;
    if (Math.random() > clamp(1.45 - 0.55 * ratio + (repScore() - 2.5) * 0.06, 0.05, 0.98)) return lost('price');
    const pages = Math.round(randi(10, 150) * (season().id === 'exams' ? 1.5 : 1));
    if (!loadPaper(pages)) return lost('empty');
    state.copierPaper -= pages;
    b = { pid: 'print', qty: pages, total: Math.round(pages * price * 100) / 100 };
  } else {
    const sold = Object.keys(CUST_WANT).filter(id => state.slots.some(sl => sl.pid === id));
    if (!sold.length) return lost('empty');
    const tw = sold.reduce((a, id) => a + CUST_WANT[id][0] * seasonWant(id), 0);
    let r = Math.random() * tw;
    const pid = sold.find(id => (r -= CUST_WANT[id][0] * seasonWant(id)) <= 0) || sold[0];
    const [, lo, hi] = CUST_WANT[pid], onShelf = shelfQty(pid);
    if (onShelf <= 0) return lost('empty');
    const offers = state.offers.filter(o => o.on && o.pid === pid && o.qty <= onShelf).sort((x, y) => x.price / x.qty - y.price / y.qty);
    if (offers.length && Math.random() < (ad ? 0.6 : 0.45)) { b = { pid, qty: offers[0].qty, total: offers[0].price }; c.offer = true; }
    else {
      const price = state.prices[pid], ratio = price / DEFAULT_PRICES[pid];
      if (Math.random() > clamp(1.45 - 0.55 * ratio + (repScore() - 2.5) * 0.06, 0.05, 0.98)) {
        // موظف المبيعات بيحاول يقنعه
        if (!(sales && Math.random() < clamp(0.8 - 0.5 * (ratio - 1), 0.15, 0.8))) return lost('price');
        c.helped = true;
      }
      let qty = Math.min(onShelf, randi(lo, hi));
      if (sales && Math.random() < 0.3 && onShelf > qty) qty = Math.min(onShelf, qty + Math.max(1, Math.round(qty * 0.5)));
      b = { pid, qty, total: Math.round(qty * price * 100) / 100 };
    }
    takeFromShelves(pid, b.qty);
  }
  s.n++; s.rev += b.total; s.items[b.pid] = (s.items[b.pid] || 0) + b.qty;
  state.sales.total = (state.sales.total || 0) + b.total;
  trackSale(b);
  if (ad) { ad.bought++; ad.rev += b.total; ad.cogs += b.qty * costPer(b.pid); }
  repRecord(c, saleRating(c, b), 'sale');
  Economy.addMerge(b.total, `مبيعات محلّي · يوم ${state.day}`);
  away.n++; away.rev += b.total;
}

}

function mkUpperTexture(p, emissive) {
  const ppm = 40, W = Math.round(p.w * ppm), Hm = p.h - MK.ceil, H = Math.round(Hm * ppm);
  return canvasTex(W, H, g => {
    g.fillStyle = emissive ? '#000' : p.wall; g.fillRect(0, 0, W, H);
    const Y = m => H - (m - MK.ceil) * ppm, X = m => m * ppm, cx = p.w / 2;
    if (!emissive) { g.fillStyle = p.trim; g.fillRect(X(cx - 7), Y(6.6), X(14), X(1.8)); }
    g.fillStyle = emissive ? '#e0d0ff' : '#f1ece0';
    g.font = `${Math.round(1.2 * ppm)}px Lalezar, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
    g.fillText(mkOwned() ? (mkHas('hyper') ? 'هايبر ماركت الخير' : 'سوبر ماركت الخير') : 'سوبر ماركت للبيع', X(cx), Y(5.7) + 3);
  });
}

// زباين بيتمشوا جوه (شكل بس، المبيعات بتتحسب لوحدها)
function updateMarket(dt) {
  if (!scene || !mkOwned()) return;
  const p = state.player, near = Math.abs(p.x - 122) < 40 && p.z < 8;
  const cs = curShift();
  for (const o of mkVis.staff) {
    if (o.shift) o.mesh.visible = o.shift === cs;
    if (!near || !o.walk || !o.mesh.visible) continue;
    o.ph = (o.ph || 0) + dt; o.t = (o.t || 0) + dt * 0.25;
    const k = (Math.sin(o.t) + 1) / 2; o.mesh.position.x = o.walk[0] + (o.walk[1] - o.walk[0]) * k;
    o.mesh.rotation.y = Math.cos(o.t) > 0 ? -Math.PI / 2 : Math.PI / 2;
    const u = o.mesh.userData, sw = Math.sin(o.ph * 7) * 0.5; u.lL.rotation.x = sw; u.lR.rotation.x = -sw;
  }
  const want = near ? Math.min(12, Math.round(mkRate() / 3 * (mkOnDuty('cashier') ? 1 : 0.3))) : 0;
  while (mkVis.shoppers.length < want) {
    const m = makePerson({ shirt: pick(SHIRTS), skin: pick(SKINS), hair: pick(['#2b1b10', '#111', '#5a3a1a', '#888']), pants: pick(['#2c3e50', '#3b3b3b', '#1f3a5f']), scarf: Math.random() < 0.45 });
    const bk = boxMesh(0.35, 0.2, 0.25, M('#c0392b')); bk.position.set(0.3, 0.85, 0.1); m.add(bk);
    const o = { mesh: m, x: rand(120, 124), z: pick([-2.1, -4.2, -6.4]), wait: rand(0, 2), ph: 0 }; m.position.set(o.x, 0.17, o.z); scene.add(m); mkVis.shoppers.push(o);
  }
  while (mkVis.shoppers.length > want) scene.remove(mkVis.shoppers.pop().mesh);
  const aisles = [-2.1, -4.2, -6.4];
  for (const o of mkVis.shoppers) {
    const u = o.mesh.userData;
    if (o.wait > 0) { o.wait -= dt; u.lL.rotation.x = u.lR.rotation.x = 0; continue; }
    if (!o.path || !o.path.length) {
      // ممر جديد: يرجع للممر اللي في النص الأول عشان مايعديش من جوه الرفوف
      const z = pick(aisles), x = z === -2.1 ? pick([rand(117.2, 118.8), rand(125.2, 126.8), rand(119.5, 124.5)]) : rand(113.6, 130.4);
      const mid = rand(120, 124);
      o.path = Math.abs(z - o.z) > 0.2 ? [{ x: mid, z: o.z }, { x: mid, z }, { x, z }] : [{ x, z }];
      o.wait = rand(1, 4); continue;
    }
    const P = o.path[0], dx = P.x - o.x, dz = P.z - o.z, d = Math.hypot(dx, dz);
    if (d < 0.08) { o.path.shift(); if (!o.path.length) o.wait = rand(1.5, 4); continue; }
    const st = Math.min(d, 1.1 * dt); o.x += dx / d * st; o.z += dz / d * st; o.ph += dt * 7;
    o.mesh.position.set(o.x, 0.17, o.z); o.mesh.rotation.y = Math.atan2(dx, dz);
    const sw = Math.sin(o.ph) * 0.5; u.lL.rotation.x = sw; u.lR.rotation.x = -sw; u.aL.rotation.x = -sw * 0.6;
  }
}
function mkTarget() {
  if (!inMarket() || !mkOwned()) return null;
  const p = state.player;
  let best = null, bd = 1.3;
  for (const t of Object.values(MK_T)) {
    if (t === MK_T.mgr && !mk().mgrOn) continue;
    const d = Math.hypot(p.x - t.x, p.z - t.z);
    if (d < bd) { best = t; bd = d; }
  }
  return best;
}

const CENTRAL = { price: 100000, cap: 1000, buyFee: 150, moveFee: 100, mins: 30 };
function central() {
  if (!state.central) state.central = { owned: false, stock: {}, avg: {}, inbound: [], log: [] };
  return state.central;
}
const cenPcs = id => central().stock[id] || 0;
const cenCartons = () => Object.keys(PRODUCTS).reduce((a, id) => a + cartonsOf(id, cenPcs(id)), 0);
const cenIncoming = () => central().inbound.filter(o => o.to === 'central').reduce((a, o) => a + o.items.reduce((b, x) => b + cartonsOf(x.id, x.pcs), 0), 0);

const cenLog = x => { const C = central(); C.log.unshift({ t: `ي${state.day} · ${clockText()}`, x }); if (C.log.length > 12) C.log.length = 12; };
// شيل من المخزن المركزي وحطه في مخزن المحل (بمتوسط تكلفته)
function cenTake(id, pcs) {
  const C = central(), a = Math.min(pcs, cenPcs(id)); if (a <= 0) return 0;
  C.stock[id] -= a;
  const per = C.avg[id] ?? PRODUCTS[id].price / PRODUCTS[id].pack;
  noteBuy(id, a, per * PRODUCTS[id].pack);
  state.warehouse[id] = (state.warehouse[id] || 0) + a;
  return a;
}
function cenArrivals() {
  const C = state.central; if (!C || !C.inbound.length) return;
  for (const o of C.inbound.filter(o => absNow() >= o.at)) {
    C.inbound.splice(C.inbound.indexOf(o), 1);
    if (o.to === 'central') {
      for (const x of o.items) {
        const have = cenPcs(x.id), per = x.unit / PRODUCTS[x.id].pack, old = C.avg[x.id] ?? per;
        C.avg[x.id] = (have * old + x.pcs * per) / (have + x.pcs); C.stock[x.id] = have + x.pcs;
      }
      cenLog(`وصل المخزن المركزي ${o.items.reduce((a, x) => a + cartonsOf(x.id, x.pcs), 0)} كرتونة`);
      toast('🏭 البضاعة وصلت المخزن المركزي', 'good', 3000);
    } else {
      for (const x of o.items) state.warehouse[x.id] = (state.warehouse[x.id] || 0) + x.pcs;
      refreshStockVisuals();
      cenLog(`النقلة وصلت مخزن المحل (${o.items.reduce((a, x) => a + cartonsOf(x.id, x.pcs), 0)} كرتونة)`);
      toast('🚚 نقلة المخزن المركزي وصلت مخزن المحل', 'good', 3000);
    }
    save();
  }
}

  } else {
    const buy = cenTab === 'buy', n = Object.values(cenCart).reduce((a, v) => a + v, 0);

function centralHandlers() {
  const C = central(), clear = () => { for (const k of Object.keys(cenCart)) delete cenCart[k]; };
  const maxFor = id => {
    if (cenTab === 'buy') {
      // المساحة بالكرتونة: اللي فاضل بعد المخزون واللي جاي واللي في السلة من أصناف تانية
      const pr = PRODUCTS[id], inc = C.inbound.filter(o => o.to === 'central').reduce((a, o) => a + o.items.filter(x => x.id === id).reduce((b, x) => b + x.pcs, 0), 0);
      const other = Object.entries(cenCart).filter(([k]) => k !== id).reduce((a, [k, v]) => a + cartonsOf(k, v * PRODUCTS[k].pack), 0);
      const R = CENTRAL.cap - cenCartons() - cenIncoming() - other, cur = cenPcs(id) + inc;
      return Math.max(0, Math.floor(((cartonsOf(id, cur) + R) * pr.perCarton - cur) / pr.pack));
    }
    const pend = C.inbound.filter(o => o.to === 'shop').reduce((a, o) => a + o.items.filter(x => x.id === id).reduce((b, x) => b + x.pcs, 0), 0);
    const room = Math.floor((WH_CAP * PRODUCTS[id].perCarton - (state.warehouse[id] || 0) - pend - pendingPcs(id)) / PRODUCTS[id].perCarton);
    return Math.max(0, Math.min(Math.floor(cenPcs(id) / PRODUCTS[id].perCarton) || (cenPcs(id) > 0 ? 1 : 0), room));
  };
  return {
    cBuyWh: () => {
      if (C.owned) return;
      if (!Economy.spend(CENTRAL.price, 'شراء المخزن المركزي')) { toast('الفلوس مش مكفية', 'bad'); return; }
      C.owned = true; cenTab = 'buy'; toast('🏭 المخزن المركزي بقى بتاعك', 'good', 4000); updateHUD(); save(); rerender();
    },
    cTab: k => { cenTab = k; clear(); rerender(); },
    cQ: a => {
      const [id, d] = a.split('.'), cur = cenCart[id] || 0, mx = maxFor(id), v = clamp(cur + +d, 0, mx);
      if (+d > 0 && v === cur) toast(cenTab === 'buy' ? 'المخزن المركزي مش هيساع أكتر' : 'مفيش أكتر من كده، أو مخزن المحل مليان', 'bad');
      if (v) cenCart[id] = v; else delete cenCart[id];
      rerender();
    },
    cClear: () => { clear(); rerender(); },
    cOrder: () => {
      const items = Object.entries(cenCart).map(([id, q]) => ({ id, q, pcs: q * PRODUCTS[id].pack, unit: wsPrice(id) * (1 - cenLine(id, q).d) }));
      if (!items.length) return;
      const total = Math.round(items.reduce((a, x) => a + x.q * x.unit, 0) + CENTRAL.buyFee);
      if (!Economy.spend(total, `طلب بضاعة للمخزن المركزي (${items.length} أصناف)`)) { toast(`محتاج ${fmt(total)}`, 'bad'); return; }
      C.inbound.push({ to: 'central', items, at: absNow() + CENTRAL.mins });
      // إحصائيات التوفير: السعر المعتاد مقابل اللي اتدفع
      if (!C.stats) C.stats = {};
      let saved = 0;
      for (const x of items) {
        const st = C.stats[x.id] || (C.stats[x.id] = { packs: 0, paid: 0, base: 0, vol: 0 }), base = x.q * PRODUCTS[x.id].price, paid = x.q * x.unit;
        st.packs += x.q; st.paid += paid; st.base += base; st.vol += x.q * wsPrice(x.id) - paid; saved += base - paid;
      }
      cenLog(`اشتريت بضاعة بـ ${fmt(total)}${Math.round(saved) ? ` · ${saved > 0 ? `وفّرت ${fmt(saved)}` : `أغلى من المعتاد بـ ${fmt(-saved)}`}` : ''}`); clear();
      toast(`🏭 الطلب اتبعت بـ ${fmt(total)}${saved > 0.5 ? ` · وفّرت ${fmt(saved)}` : ''} · هيوصل بعد نص ساعة`, 'good', 4000); updateHUD(); save(); rerender();
    },
    cMove: () => {
      const entries = Object.entries(cenCart); if (!entries.length) return;
      if (!Economy.spend(CENTRAL.moveFee, 'نقلة من المخزن المركزي للمحل')) { toast('الفلوس مش مكفية النقلة', 'bad'); return; }
      const items = [];
      for (const [id, q] of entries) {
        const pcs = Math.min(cenPcs(id), q * PRODUCTS[id].perCarton); if (pcs <= 0) continue;
        const per = C.avg[id] ?? PRODUCTS[id].price / PRODUCTS[id].pack;
        C.stock[id] -= pcs; noteBuy(id, pcs, per * PRODUCTS[id].pack);
        items.push({ id, pcs });
      }
      C.inbound.push({ to: 'shop', items, at: absNow() + CENTRAL.mins });
      cenLog(`بعت نقلة للمحل: ${items.map(x => `${cartonsOf(x.id, x.pcs)} ${PRODUCTS[x.id].short}`).join('، ')}`); clear();
      toast('🚚 النقلة طالعة على مخزن المحل · توصل بعد نص ساعة', 'good', 3500); updateHUD(); save(); rerender();
    },
  };
}

const inlandFee = cbm => hasDev('port') ? 0 : Math.round(Math.max(1, cbm) * 400);   // نقل بري من ميناء بعيد (ج)
const tariffWild = cat => CN_TARIFF[cat] * (hasDev('fta') ? 0.3 : 1);
const tariffChina = () => 0.08 * (hasDev('fta') ? 0.3 : 1);

// حالة التجارة
function trade() {
  if (!state.trade) state.trade = { cnWh: {}, cnCost: {}, wcStock: {}, wcCost: {}, held: [], wx: {}, wxCost: {}, cnx: {}, ships: [], wcSold: {}, cnSold: {}, wxBought: {}, factories: {}, lic: {}, stats: { imp: 0, exp: 0, profit: 0 } };
  return state.trade;
}
// السوق: كل ما تبيع أكتر من اللي السوق يستوعبه في اليوم السعر بينزل
const mktFactor = (sold, depth) => Math.max(0.45, 1 - 0.35 * (sold / depth));
const wcPrice = id => CN_PRODUCTS[id] ? CN_PRODUCTS[id].wc * mktFactor(trade().wcSold[id] || 0, CN_PRODUCTS[id].depth) : WX_GOODS[id].wc * mktFactor(trade().wcSold[id] || 0, WX_GOODS[id].wdepth);
const cnPrice = id => WX_GOODS[id].cn * mktFactor(trade().cnSold[id] || 0, WX_GOODS[id].depth);
const cartonsTxt = (n, cq) => `${Math.ceil(n / cq)} كرتونة`;
// ---------- الشحنات (في الاتجاهين) ----------
function addAvg(stock, costMap, id, n, unitCost) {
  const have = stock[id] || 0, old = costMap[id] ?? unitCost;
  costMap[id] = (have * old + n * unitCost) / Math.max(1, have + n); stock[id] = have + n;
}
function shipMeasure(items, catalog) {
  let cbm = 0, kg = 0;
  for (const x of items) { const P = catalog[x.id], per = P.cq || 1; cbm += x.n / per * P.cbm; kg += x.n / per * P.kg; }
  return { cbm: Math.round(cbm * 100) / 100, kg: Math.round(kg) };
}
function tradeTick() {
  const T = state.trade; if (!T || !T.ships.length) return;
  for (const sh of T.ships.filter(s => absNow() >= s.at)) {
    T.ships.splice(T.ships.indexOf(sh), 1);
    if (sh.dir === 'toWild') {
      const duty = Math.round(sh.items.reduce((a, x) => a + x.n * x.val * tariffWild(CN_PRODUCTS[x.id].cat), 0)) + sh.inland;
      const rel = () => { for (const x of sh.items) addAvg(T.wcStock, T.wcCost, x.id, x.n, x.val * (1 + tariffWild(CN_PRODUCTS[x.id].cat)) + (x.ship ?? sh.unitShip ?? 0) + sh.inland / sh.items.reduce((a, y) => a + y.n, 0)); dev().imports += sh.items.reduce((a, x) => a + x.n * x.val, 0); };
      // الجمارك والنقل مابيتخصموش لوحدهم: الشحنة بتستنى في الجمارك لحد ما تروح تدفع من مكتب السفر
      if (duty <= 0) { rel(); toast('📦 شحنة الصين وصلت وايلد سيتي', 'good', 4500); }
      else if (sh.erp && cnsPayDuty(duty)) { rel(); toast('🖥️ شحنة الـERP وصلت والجمارك اتدفعت من ميزانية المحل · البضاعة في المخزن', 'good', 5000); }
      else { T.held.push({ ...sh, duty }); toast(`📦 شحنة الصين وصلت ومستنياك في الجمارك · ادفع ${fmt(duty)} جمارك ونقل من مكتب السفر والتجارة الدولية`, 'good', 6000); }
    } else {
      const duty = Math.round(sh.items.reduce((a, x) => a + x.n * WX_GOODS[x.id].cn, 0) * tariffChina());
      if (Yuan.spend(duty, 'جمارك صينية على شحنة تصدير')) { for (const x of sh.items) addAvg(T.cnx, T.cnxCost || (T.cnxCost = {}), x.id, x.n, x.val / fxRate() + duty / sh.items.reduce((a, y) => a + y.n, 0)); toast(`🚢 بضاعتك وصلت الصين${duty ? ` · جمارك ${fmtY(duty)}` : ''} · بيعها في سوق الاستيراد الصيني`, 'good', 5000); }
      else { T.held.push({ ...sh, duty, cn: true }); toast(`🚢 شحنتك وصلت الصين ومحجوزة في الجمارك: محتاج ${fmtY(duty)} يوان`, 'bad', 5000); }
    }
    save();
  }
}
function releaseHeld(i) {
  const T = trade(), h = T.held[i]; if (!h) return;
  if (h.cn) {
    if (!Yuan.spend(h.duty, 'جمارك صينية على شحنة تصدير')) { toast(`محتاج ${fmtY(h.duty)}`, 'bad'); return; }
    for (const x of h.items) addAvg(T.cnx, T.cnxCost || (T.cnxCost = {}), x.id, x.n, x.val / fxRate());
  } else {
    if (!Economy.spend(h.duty, 'جمارك ونقل شحنة من الصين')) { toast(`محتاج ${fmt(h.duty)}`, 'bad'); return; }
    for (const x of h.items) addAvg(T.wcStock, T.wcCost, x.id, x.n, x.val * (1 + tariffWild(CN_PRODUCTS[x.id].cat)) + (x.ship ?? h.unitShip ?? 0) + h.inland / h.items.reduce((a, y) => a + y.n, 0));
    dev().imports += h.items.reduce((a, x) => a + x.n * x.val, 0);
  }
  T.held.splice(i, 1); toast('✅ الشحنة خرجت من الجمارك', 'good'); save(); rerender();
}
// آخر اليوم: السوق بيستوعب تاني، المصانع بتنتج، الإيجارات
function tradeEndDay() {
  const T = state.trade;
  if (T) {
    for (const id of Object.keys(T.wcSold)) T.wcSold[id] = Math.max(0, T.wcSold[id] - (CN_PRODUCTS[id] ? CN_PRODUCTS[id].depth : WX_GOODS[id].wdepth));
    for (const id of Object.keys(T.cnSold)) T.cnSold[id] = Math.max(0, T.cnSold[id] - WX_GOODS[id].depth);
    T.wxBought = {};
    for (const [k, F] of Object.entries(WF)) {
      if (!T.factories[k]) continue;
      const cost = F.op * F.perDay;
      if (Economy.spend(cost, `تشغيل ${F.name}`)) { addAvg(T.wx, T.wxCost, F.makes, F.perDay, F.op); T.factories[k].made = (T.factories[k].made || 0) + F.perDay; }
      else toast(`🏭 ${F.name} ماشتغلش النهارده: محتاج ${fmt(cost)} تشغيل`, 'bad', 4000);
    }
  }
  if (typeof cnEndDay === 'function') cnEndDay();
}

function qtyStep(key, unit, max) {

  return `<div class="stepper"><button type="button" data-act="tq:${key}.-10">−10</button><button type="button" data-act="tq:${key}.-1">−</button><span>${v} ${unit}</span><button type="button" data-act="tq:${key}.1">+</button><button type="button" data-act="tq:${key}.10">+10</button></div>${max !== undefined ? `<small class="when">المتاح ${max}</small>` : ''}`;
}
function tqHandler(limits) {
  return a => {
    const [key, d] = a.split('.'), mx = limits(key);
    tradeQty[key] = clamp((tradeQty[key] || 0) + +d, 0, Math.max(0, mx));
    rerender();
  };
}

function exportShipHTML() {
  const T = trade(), items = Object.keys(WX_GOODS).map(id => ({ id, n: Math.min(tradeQty['x:' + id] || 0, T.wx[id] || 0) })).filter(x => x.n > 0);

  const m = shipMeasure(items, WX_GOODS);
  return `<h3 class="sec">ابعت للصين <span>${m.cbm} م³ · ${m.kg} كجم</span></h3>` + Object.entries(SHIP).map(([k, S]) => {
    const costY = S.per === 'kg' ? m.kg * shipRate(k) : Math.max(1, m.cbm) * shipRate(k), c = Math.round(costY * fxRate()) + (k !== 'air' ? inlandFee(m.cbm) : 0);
    return `<button class="big" type="button" data-act="shipX:${k}"><b>${S.icon} ${S.name} · ${fmt(c)}</b><small>${S.desc}${k !== 'air' && !hasDev('port') ? ' + يوم نقل بري لأن مفيش ميناء عندك' : ''}</small></button>`;
  }).join('');
}
function shipExport(mode) {
  const T = trade(), items = Object.keys(WX_GOODS).map(id => ({ id, n: Math.min(tradeQty['x:' + id] || 0, T.wx[id] || 0) })).filter(x => x.n > 0);
  if (!items.length) return;
  const m = shipMeasure(items, WX_GOODS), S = SHIP[mode];
  const cost = Math.round((S.per === 'kg' ? m.kg * shipRate(mode) : Math.max(1, m.cbm) * shipRate(mode)) * fxRate()) + (mode !== 'air' ? inlandFee(m.cbm) : 0);
  if (!Economy.spend(cost, `شحن تصدير للصين (${S.name})`)) { toast(`الشحن بـ ${fmt(cost)} والفلوس مش مكفية`, 'bad'); return; }
  const meas = x => x.n * (S.per === 'kg' ? WX_GOODS[x.id].kg : WX_GOODS[x.id].cbm), totM = items.reduce((a, x) => a + meas(x), 0) || 1;
  for (const x of items) { x.val = (T.wxCost[x.id] || 0) + cost * meas(x) / totM / x.n; T.wx[x.id] -= x.n; dev().exports += x.n * (T.wxCost[x.id] || 0); }
  T.ships.push({ dir: 'toChina', mode, items, at: absNow() + shipMins(mode), cbm: m.cbm, kg: m.kg });
  tradeQty = {}; toast(`${S.icon} الشحنة طلعت للصين · توصل بعد ${fmtDur(shipMins(mode))}`, 'good', 4500); save(); rerender();
}
function sellImport(id, n) {

      }).join('') : '');
    bind(b, {

      all: id => { shipQ[id] = T.cnWh[id] || 0; rerender(); },

        // تكلفة الشحن بتتوزع على الأصناف على قد وزنها (جوي) أو حجمها (بحري)

// ================= نظام المقاولات: مكتب جنب البيت · أراضي العاصمة · تصميم وترخيص · مشاريع · عمال ومقاولين ومهندسين وسواقين =================
const CON = () => state.con || (state.con = { lands: {}, projects: {}, box: 0, rmc: [], drivers: {} });
const BLOCK_M2 = 2500;
const blk = n => CAP_BLOCKS[n - 1];
const blkFront = b => (b.z1 <= 4 || b.z1 === -56) ? 1 : -1;   // الواجهة ناحية الشارع
const blkRow = n => Math.floor((n - 1) / 6);
const blkDesc = n => blkRow(n) < 2 ? 'على المحور الرئيسي' : 'شارع جانبي';
// تطور العاصمة: كل مبنى بيخلص وكل مشروع شغال وكل أرض بتتباع بيعلّوا سعر المتر
function capDev() {
  const C = CON(), P = Object.values(C.projects);
  return 1 + P.filter(p => p.done).length * 0.04 + P.filter(p => !p.done && p.started).length * 0.015 + Object.keys(C.lands).length * 0.006;
}
const landPpm = n => Math.round((blkRow(n) < 2 ? 12000 : 9500) * (1.08 - ((n - 1) % 6) * 0.028) * capDev() / 50) * 50;
const LAND_INST = { down: 0.25, n: 8, every: 30, rate: 0.10 }, LAND_CASH_OFF = 0.05;
function landOffer(n) {
  const ppm = landPpm(n), price = ppm * BLOCK_M2, down = Math.round(price * LAND_INST.down), per = Math.ceil((price - down) * (1 + LAND_INST.rate) / LAND_INST.n);
  return { ppm, price, cash: Math.round(price * (1 - LAND_CASH_OFF)), down, per };
}
function payWB(v, why) {   // من المحفظة، ولو مش مكفية من حساب التوفير
  if (state.money >= v) return Economy.spend(v, why);
  const B = state.bank; if (B && B.open && B.balance >= v) { B.balance -= v; bankLog(-v, why); bookAdd(-v, why); return true; }
  return false;
}
function buyLand(n, plan) {
  const C = CON(); if (C.lands[n]) return false;
  const o = landOffer(n);
  if (plan === 'cash') {
    if (!Economy.spend(o.cash, `أرض بلوك ${n} في العاصمة (كاش)`)) { toast('الفلوس اللي في المحفظة مش مكفية', 'bad'); return false; }
    C.lands[n] = { day: state.day, ppm: o.ppm, price: o.price, plan: 'cash', total: o.cash, paid: o.cash, left: 0, per: 0, next: 0, late: 0, lateDays: 0, stock: {} };
  } else {
    if (!Economy.spend(o.down, `مقدم أرض بلوك ${n} في العاصمة`)) { toast('المقدم مش معاك في المحفظة', 'bad'); return false; }
    C.lands[n] = { day: state.day, ppm: o.ppm, price: o.price, plan: 'inst', total: o.down + o.per * LAND_INST.n, paid: o.down, left: LAND_INST.n, per: o.per, next: state.day + LAND_INST.every, late: 0, lateDays: 0, stock: {} };
  }
  toast(`🏜️ مبروك! بلوك ${n} في العاصمة بقى ملكك (${fmt(o.price)} · ${fmt(o.ppm)}/م²)`, 'good', 5000);
  conRefresh(n); refreshBlockSigns(); updateHUD(); save(); return true;
}
function landDues() {
  for (const [n, L] of Object.entries(CON().lands)) {
    if (!L.left || state.day < L.next) continue;
    const due = Math.min(L.per, L.total - L.paid);
    if (payWB(due, `قسط أرض بلوك ${n}`)) {
      L.paid += due; L.left--; L.next = state.day + LAND_INST.every; L.lateDays = 0;
      if (!L.left || L.paid >= L.total) { L.left = 0; toast(`🎉 خلّصت أقساط أرض بلوك ${n}`, 'good', 4500); }
      else toast(`🏜️ اتدفع قسط أرض بلوك ${n}: ${fmt(due)} · فاضل ${L.left} أقساط`, '', 4000);
    } else {
      const fee = Math.round(due * 0.02); L.total += fee; L.late++; L.lateDays = (L.lateDays || 0) + 1; L.next = state.day + 1;
      toast(`⚠️ قسط أرض بلوك ${n} (${fmt(due)}) ماتدفعش · غرامة ${fmt(fee)}`, 'bad', 5000);
      if (L.lateDays === 15) toast(`📜 إنذار من جهاز مدينة العاصمة: البنا في بلوك ${n} هيقف لحد ما تسدد`, 'bad', 7000);
    }

}
const landStopped = n => { const L = CON().lands[n]; return !!L && L.lateDays >= 15; };
// ---------- حساب تكلفة كل أرض/مشروع بالظبط ----------
const matVal = (id, q) => q * (id === 'rmc' ? RMC_PRICE : MAT_ITEMS[id] ? MAT_ITEMS[id].price : 0);
function lc(n) {   // تكاليف اللوجستيات والخامات على الأرض (لو الحفظ قديم بنحسب الخامات اللي وصلت من المخزون + اللي اتصرف في المراحل)
  const C = CON(), L = C.lands[n]; if (L.cost) return L.cost;

  const p = C.projects[n];
  if (p) p.stages.forEach((st, i) => { const f = i < p.si ? 1 : i === p.si ? p.prog : 0; if (f) for (const [k, q] of Object.entries(st.need)) mat += q * f * reqPrice(k); });
  return (L.cost = { mat: Math.round(mat), trans: 0, rent: 0, drivers: 0, fit: 0 });
}
function conRecv(n, id, q) { const L = CON().lands[n]; if (!L || q <= 0) return; lc(n); L.stock[id] = (L.stock[id] || 0) + q; L.cost.mat += matVal(id, q); }
// بيدفع من خزنة المقاولات، ولو مش مكفية من المحفظة
function payProj(v, why) { const C = CON(); if (C.box >= v) { C.box -= v; return 'box'; } return Economy.spend(v, why) ? 'wallet' : null; }
function conCost(n) {
  const C = CON(), L = C.lands[n], p = C.projects[n], c = lc(n), sp = p ? p.spent : { fees: 0, labor: 0, rent: 0 };
  const rows = [['🏜️ الأرض', L.total, L.left ? `مدفوع ${fmt(L.paid)} والباقي أقساط` : ''], ['📐 التصميم والرخصة', sp.fees], ['👷 العمالة والمقاولين والمهندسين', sp.labor], ['🏗️ إيجار معدات المراحل', sp.rent, 'حفار ولودر وونش برجي'], ['🧱 الخامات اللي وصلت الموقع', c.mat, 'بسعر الشرا'], ['🚚 النقل بالنقلة', c.trans], ['📅 إيجار عربيات ومعدات', c.rent], ['🧑‍✈️ أجرة السواقين', c.drivers], ['🛋️ تجهيز للتشغيل', c.fit]];

}
function costHTML(n) {
  const C = CON(), p = C.projects[n], K = conCost(n), M = p && p.mk;
  let h = `<h3 class="sec">💵 حساب بلوك ${n} بالتفصيل</h3><table class="ledger"><tbody>${K.rows.filter(r => r[1] >= 1).map(([t, v, note]) => `<tr><td>${t}${note ? `<br><small class="when">${note}</small>` : ''}</td><td class="minus">${fmt(v)}</td></tr>`).join('')}
    <tr><td><b>إجمالي التكلفة</b></td><td class="minus"><b>${fmt(K.total)}</b></td></tr></tbody></table>`;
  if (p) h += `<p class="note">يعني ${fmt(K.total / p.TA)} لكل متر مبني (${p.TA.toLocaleString('en-US')} م²)${p.done ? '' : ' لحد دلوقتي'}.</p>`;
  if (M) {

function netWorth() {

function sellWx(id, n) {
  const T = trade(), G = WX_GOODS[id]; n = Math.min(n, T.wx[id] || 0); if (!n || !G.wc) return;
  let rev = 0; for (let i = 0; i < n; i++) { rev += wcPrice(id); T.wcSold[id] = (T.wcSold[id] || 0) + 1; }
  const cost = n * (T.wxCost[id] || 0); T.wx[id] -= n; T.stats.profit += rev - cost;
  Economy.add(rev, `بيع ${n} ${G.name} في وايلد سيتي`); tradeQty['x:' + id] = 0;
  toast(`💰 بعت ${n} ${G.name} بـ ${fmt(rev)}`, 'good'); updateHUD(); save(); rerender();
}

function instaHandlers(body) {
  const inp = body.querySelector('#ipAmt');
  if (inp) inp.addEventListener('input', () => { ipAmt = Math.max(0, Math.floor(+inp.value || 0)); body.querySelector('[data-act="ipSend"]').textContent = `ابعت ${fmt(ipAmt)}`; });
  return {
    ipTo: id => { ipTo = id; rerender(); },
    ipA: v => { ipAmt = v === 'all' ? Math.floor(state.bank.balance) : +v; rerender(); },
    ipSend: () => {
      const B = state.bank, v = Math.floor(ipAmt), t = ipTargets().find(x => x.id === ipTo);

      if (B.balance < v) { toast('رصيد البنك مش مكفي', 'bad'); return; }
      B.balance -= v; bankLog(-v, `إنستا باي لـ${t.name}`);

function hr() { if (!state.hr) state.hr = { on: true, box: 0, log: [], next: 0, paidDay: -1, spent: 0 }; return state.hr; }
function hrLog(x) { const H = hr(); H.log.unshift({ t: `يوم ${state.day} · ${clockText()}`, x }); if (H.log.length > 12) H.log.length = 12; }
const roleCount = (r, sh) => state.staff.filter(e => e.role === r && (!sh || shiftOf(e) === sh)).length;
// الخطة: كام موظف محتاجين من كل نوع ولية
function hrPlan(sh = curShift()) {
  const rm = repMult() * drawMult() * season().demand * shiftDemand(sh) * cityMult(), st = shopStats(), cap = shopCap();
  const extra = sh === curShift() ? subRateSec() : 0;
  const crowd = n => 40 * ((1 + 0.5 * n) * rm / 26 + extra);   // متوسط عدد الزباين جوه المحل في نفس الوقت
  const per = st.n >= 10 ? Math.max(0, (st.rev - st.cost) / st.n) : 12;   // ربح الزبون الواحد
  const openSec = SHIFTS[sh].hours * 60 / settings.timeSpeed;   // الموظف بيشتغل شيفت واحد
  const gain = openSec * rm / 26 * 0.5 * per;   // ربح موظف مبيعات زيادة في الشيفت
  let sales = 0;
  // الكاشير اللي محتاجينه على قد الزباين اللي بيخلصوا في الدقيقة (الزيارة ~40 ثانية)
  const flowCash = n => Math.max(1, Math.ceil(Math.min(crowd(n), cap) / 40 * checkoutSec() * 1.25));
  const maxSales = STAFF_MAX - HR_STOCK - flowCash(24);
  if (gain > ROLES.sales.wage * 1.3) while (sales < maxSales && crowd(sales + 1) <= cap - 0.8) sales++;
  const now = sh === curShift(), a = now ? activeAd() : null;
  let cashier = Math.max(flowCash(sales), a ? cashiersNeeded(AD_TIERS[a.tier]) : 1);
  const onDuty = Math.max(1, onDutyCashiers());
  if (now && custQueue.length >= 5 * onDuty) cashier = Math.max(cashier, onDutyCashiers() + 1);
  const why = {
    sales: gain <= ROLES.sales.wage * 1.3 ? `ربح الزبون قليل (${fmtMoney(per)})، الموظف مش هيجيب مرتبه`
      : `المحل يستوعب ~${cap} زبون في نفس الوقت. بـ ${sales} موظفين في الشيفت هيبقى فيه ~${crowd(sales).toFixed(1)}. كل موظف بيكسب ~${fmt(gain)} في الشيفت`,
    cashier: a ? `فيه ${AD_TIERS[a.tier].name} شغال ومحتاج ${cashier} كاشير` : now && custQueue.length >= 5 * onDuty ? 'الطابور طويل' : cashier > 1 ? `الزحمة محتاجة ${cashier} كاشير` : 'كاشير واحد مكفي الزحمة العادية',

function hrHire(role, sh) {
  const H = hr(), w = ROLES[role].wage;
  if (shiftCount(sh) >= STAFF_MAX) return false;
  if (H.box < w) {
    if (!H.warned) { H.warned = true; hrLog(`عايزة توظف ${ROLES[role].name} والصندوق مش مكفي`); toast('💼 صندوق الـHR خلص · حط فلوس عند أستاذة سلمى في المكتب', 'bad', 4500); }
    return false;
  }
  H.box -= w; H.spent += w; book().hr += w; H.warned = false;
  shopStats().wages += w;
  if (role === 'sales') shopStats().salesWages = (shopStats().salesWages || 0) + w;
  const e = newStaff(role, 1, sh);
  hrLog(`وظّفت ${e.name} (${ROLES[role].name} · ${SHIFTS[sh].name}) يوم بـ ${w} ج`);
  toast(`💼 الـHR وظّفت ${e.name} ${ROLES[role].name} · شيفت ${SHIFTS[sh].name}`, 'good');
  return true;
}
function hrTick() {
  if (!isOwned(BIGSHOP()) || !state.hr || !state.hr.on) return;
  const H = state.hr, T = absNow();
  if (T < H.next) return;
  H.next = T + 30;
  if (H.paidDay !== state.day) {
    if (H.box < HR_WAGE) { if (!H.warned) { H.warned = true; hrLog('مرتبي مش موجود في الصندوق، مش هشتغل لحد ما تحط فلوس'); toast('💼 صندوق الـHR مش مكفي حتى مرتبها', 'bad', 4000); } return; }
    H.box -= HR_WAGE; H.spent += HR_WAGE; book().hr += HR_WAGE; H.paidDay = state.day; shopStats().wages += HR_WAGE;
    hrLog(`خدت مرتب اليوم ${HR_WAGE} ج`);
  }
  let hired = false;
  // بتوظف للشيفت اللي شغال وللشيفت اللي بعده عشان يستلم على طول
  for (const sh of ['am', 'pm']) {
    const plan = hrPlan(sh);
    for (const role of ['stock', 'cashier', 'sales']) {
      const need = plan[role];
      while (roleCount(role, sh) < need) { if (!hrHire(role, sh)) break; hired = true; }
    }
  }
  if (hired) { syncStaff(); save(); }
}
// نص الليل: الـHR بتجدد يوم لكل اللي عقدهم خلصان ولسه محتاجينهم
function hrRenew(only) {
  if (!state.hr || !state.hr.on) return;
  const H = state.hr;
  for (const sh of ['am', 'pm']) for (const role of ['stock', 'cashier', 'sales']) {
    if (only && sh !== only) continue;
    const plan = hrPlan(sh);
    const list = state.staff.filter(e => e.role === role && shiftOf(e) === sh);
    let keep = list.filter(e => e.days > 1).length;
    const need = plan[role];
    for (const e of list.filter(e => e.days <= 1)) {
      if (keep >= need) continue;
      const w = ROLES[role].wage;
      if (H.box < w) break;
      H.box -= w; H.spent += w; book().hr += w; shopStats().wages += w;
      if (role === 'sales') shopStats().salesWages = (shopStats().salesWages || 0) + w;
      e.days += 1; keep++;
      hrLog(`جددت لـ${e.name} (${ROLES[role].name}) يوم بـ ${w} ج`);
    }
  }
}

// موظف المبيعات: يا رايح لزبون، يا واقف معاه، يا بيتمشى في المحل
function salesStep(o, dt) {
  if (o.helping && !custs.includes(o.helping)) { o.helping = null; o.path = null; }
  if (o.path && o.path.length) {
    const P = o.path[0], dx = P.x - o.x, dz = P.z - o.z, d = Math.hypot(dx, dz);
    if (d < 0.05) { o.path.shift(); return; }
    const st = Math.min(d, (o.helping ? 1.8 : 1.1) * dt);
    o.x += dx / d * st; o.z += dz / d * st; o.dir = Math.atan2(dx, dz); o.phase += dt * 7; o.walking = true;
    return;
  }
  if (o.helping) { o.atCust = true; o.dir = Math.atan2(o.helping.x - o.x, o.helping.z - o.z); return; }
  o.wait = rand(1.5, 4);
  o.path = routeTo(o, { x: rand(165, 181), z: rand(-4.8, -1.2) });
}
function updateStaff(dt) {
  const cs = curShift();
  for (const o of staffMeshes) {
    const on = cs === shiftOf(o.e);
    o.mesh.visible = on; if (!on) continue;
    const u = o.mesh.userData;
    o.walking = false;
    if (!o.fixed && !panelOpen()) {
      if (o.wait > 0) o.wait -= dt;
      else if (o.e.role === 'stock' && stockerStep(o, dt)) { /* شغال على كرتونة */ }
      else if (o.e.role === 'sales') salesStep(o, dt);
      else {
        const dx = o.tx - o.x, dz = o.tz - o.z, d = Math.hypot(dx, dz);
        if (d < 0.05) {
          o.wait = rand(1.5, 4);
          if (o.e.role === 'stock') { o.tx = 165 + rand(0, 17); o.tz = rand(-9.2, -8.7); }
          else { o.tx = rand(165, 181); o.tz = rand(-4.8, -1.2); }
        } else { const st = Math.min(d, 1.1 * dt); o.x += dx / d * st; o.z += dz / d * st; o.dir = Math.atan2(dx, dz); o.phase += dt * 7; o.walking = true; }
      }
    }
    if (o.bubbleT > 0 && (o.bubbleT -= dt) <= 0) o.bubble.visible = false;
    const moving = o.walking;
    if (o.box) o.box.visible = !!o.carry;
    const sw = moving ? Math.sin(o.phase) * 0.5 : 0;
    u.lL.rotation.x = sw; u.lR.rotation.x = -sw;
    if (o.carry) u.aL.rotation.x = u.aR.rotation.x = -1.3;
    else if (o.fixed) { u.aL.rotation.x = u.aR.rotation.x = -0.9 + Math.sin(performance.now() / 90) * 0.05; }
    else { u.aL.rotation.x = -sw * 0.6; u.aR.rotation.x = sw * 0.6; }
    o.mesh.position.set(o.x, 0.17, o.z);
    o.mesh.rotation.y = o.dir || 0;
  }
}

function migrate(s) {
  // الحفظ القديم كان 2D (x,y بالبكسل)
  s.owned = s.owned || {};
  s.bank = Object.assign({ open: false, balance: 0, earned: 0, log: [] }, s.bank);
  s.vehicles = s.vehicles || {}; s.boxInv = s.boxInv || {}; s.box = !!s.box; s.delivery = Object.assign(newDelivery(), s.delivery); s.carry = !!s.carry; if (!BAGS[s.bag]) s.bag = null; if (!(s.motor && typeof s.motor.charge === 'number')) s.motor = null; if (!Array.isArray(s.staff)) s.staff = []; s.warehouse = s.warehouse || {}; s.cargo = Object.assign({ hands: [], box: [] }, s.cargo); s.prices = Object.assign({}, DEFAULT_PRICES, s.prices);
  s.truck = Object.assign({ load: [], trip: null }, s.truck);
  if (!Array.isArray(s.slots) || s.slots.length !== RACKS.length * 4) s.slots = defaultSlots();
  if (s.shelves) {
    // الرفوف القديمة كانت صنف لكل استاند: نوزّع اللي عليها على الأدوار
    for (const [id, pcs] of Object.entries(s.shelves)) {
      let left = pcs || 0;
      for (const sl of s.slots) if (sl.pid === id && left > 0) { const a = Math.min(BOARD_CAP * PRODUCTS[id].perCarton, left); sl.pcs = a; left -= a; }
      if (left > 0) s.warehouse[id] = (s.warehouse[id] || 0) + left;
    }
  }
  delete s.shelves;
  // الكشكول السلك: لو مالوش دور، خد آخر دورين فاضيين من استاند التصوير
  if (!s.migWire) {
    s.migWire = true;
    if (!s.slots.some(sl => sl.pid === 'wireNb')) for (const i of [10, 11]) if (s.slots[i] && s.slots[i].pcs === 0 && s.slots[i].pid === 'copy') s.slots[i].pid = 'wireNb';
  }
  // الآلة الحاسبة: دور فاضي، أو دور من صنف ليه أكتر من دور (السبورة الأول) وبضاعته تتنقل لأدوار صنفه أو المخزن
  if (!s.migCalc && Array.isArray(s.slots)) {
    s.migCalc = true;
    if (!s.slots.some(sl => sl.pid === 'calc')) {
      const n = id => s.slots.filter(sl => sl.pid === id).length, rank = sl => !sl.pid ? 0 : sl.pid === 'rotoBoard' ? 1 : 2;
      const sl = s.slots.filter(sl => !sl.pid || (PRODUCTS[sl.pid] && n(sl.pid) > 1)).sort((a, b) => rank(a) - rank(b) || a.pcs - b.pcs)[0];
      if (sl) {
        let left = sl.pid ? sl.pcs : 0;
        for (const o of s.slots) if (left > 0 && o !== sl && o.pid === sl.pid) { const a = Math.min(BOARD_CAP * PRODUCTS[o.pid].perCarton - o.pcs, left); o.pcs += a; left -= a; }
        if (left > 0) s.warehouse[sl.pid] = (s.warehouse[sl.pid] || 0) + left;
        sl.pid = 'calc'; sl.pcs = 0;
      }
    }
  } if (!Array.isArray(s.ads)) s.ads = []; if (!Array.isArray(s.offers)) s.offers = []; s.rep = Object.assign({ score: 3, recent: [], reviews: [] }, s.rep); s.sales = Object.assign({ day: 0, n: 0, rev: 0, lost: 0, items: {}, total: 0 }, s.sales);
  if (!s.shopStats) {
    // أول مرة: نبدأ الحسابات باللي اتباع النهارده (قبل البرنامج ده)
    const st = s.shopStats = { since: s.sales.day || null, n: s.sales.n || 0, rev: 0, cost: 0, wages: 0, items: {}, days: {} };
    for (const [id, q] of Object.entries(s.sales.items || {})) if (PRODUCTS[id]) {
      const rev = q * (s.prices[id] || DEFAULT_PRICES[id]), cost = q * costPer(id);
      st.items[id] = { qty: q, rev, cost }; st.rev += rev; st.cost += cost;
    }
    if (st.since && st.rev) st.days[st.since] = { rev: st.rev, cost: st.cost };
  }
  if (s.stockV !== 2) {
    // الحفظ القديم كان بيعد الكرتونة = رابطة واحدة: حوّله لقطع
    for (const o of [s.warehouse, s.shelves || {}]) for (const id of Object.keys(o)) if (PRODUCTS[id]) o[id] *= PRODUCTS[id].pack;
    s.stockV = 2;
  }
  // الكراتين اللي معاك لازم تبقى لستة (الحفظ القديم كان object)
  for (const k of ['hands', 'box']) if (!Array.isArray(s.cargo[k])) {
    const old = s.cargo[k] || {}; s.cargo[k] = [];
    for (const [id, n] of Object.entries(old)) if (PRODUCTS[id] && n > 0) for (let i = 0; i < n; i++) s.cargo[k].push({ id, pcs: PRODUCTS[id].pack });
  }
  for (const k of ['hands', 'box']) s.cargo[k] = s.cargo[k].filter(c => c && PRODUCTS[c.id] && c.pcs > 0);
  if (s.riding && !s.vehicles[s.riding]) s.riding = null;
  if (s.inside !== 'bank') s.inside = null;
  if (typeof s.player?.z !== 'number' || typeof s.player?.yaw !== 'number') s.player = { ...HOME_SPOT };
  return s;
}

// ---------- الحلقة الرئيسية ----------
let last = 0, saveTimer = 0, hudTimer = 0;
function frame(t) {
  if (stale()) return;
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  if (!panelOpen()) {
    const walking = movePlayer(dt);
    liveTick = true; advanceTime(dt * settings.timeSpeed, walking ? (state.carry || handsN() ? 'work' : 'walk') : 'awake'); liveTick = false;
    checkFaint();
    saveTimer += dt; if (saveTimer > 8) { saveTimer = 0; save(); cloudTick(); }
    if (state.reportPending && !panelOpen() && !$('#fade').classList.contains('on')) showReport(undefined, true);
    if (away && !$('#fade').classList.contains('on')) awaySummary();
  } else player.moving = false;
  updateWorld(dt);
  updateSky();
  updateCamera();
  rpUpdate(dt);
  renderer.render(scene, camera);
  hudTimer += dt; if (hudTimer > 0.2) { hudTimer = 0; updateHUD(); drawMini(); updateNotice(); }
  updatePrompt();
  requestAnimationFrame(frame);
}

function start(data) {
  state = migrate((data && data.state) || load() || newState());
  lifeInit();
  if (state.mgr && state.mgr.box > 0) { state.money += state.mgr.box; state.mgr.box = 0; }   // صندوق مدير المحل اتلغى: الفلوس بترجع المحفظة
  window.claude?.hot?.snapshot?.(() => ({ state }));
  if (state.ver && state.ver < GAME_VER) setTimeout(() => toast(`✨ اللعبة اتحدّثت للنسخة ${GAME_VER}`, 'good', 5000), 1500);
  state.ver = GAME_VER;
  updateHUD();
  applySettings();
  if (isTouch) toast(settings.joySide === 'right' ? 'اسحب باليمين عشان تمشي، وبالشمال عشان تبص حواليك' : 'اسحب بالشمال عشان تمشي، وباليمين عشان تبص حواليك', '', 4500);
  else if (state.ledger.length <= 1 && state.stats.shifts === 0) toast('امشي بـ WASD وبص بالماوس · اضغط E قدام أي باب');
  const fontsReady = document.fonts ? Promise.all([document.fonts.load('40px Lalezar'), document.fonts.ready]).catch(() => {}) : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => {
    if (!window.THREE) { $('#hint').hidden = false; $('#hint').textContent = 'مكتبة الرسم 3D ماحملتش. جرّب تعمل ريفرش للصفحة.'; return; }
    initThree();
    requestAnimationFrame(frame);
  });
  cloudInit();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
